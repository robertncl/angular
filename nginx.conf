# Production server config for the built Angular bundle.
# Paired with the multi-stage `dockerfile`; replaces the previous `ng serve`
# entrypoint, which was a development server and not safe to expose.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version on responses and error pages.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Static assets ----------------------------------------------------
    # Build output is content-hashed, so it can be cached immutably.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # Set Cache-Control directly rather than via `expires`, which would
        # emit a second, conflicting Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — any unknown path (and ?city= deep links) resolves to
    # index.html, which must never be cached. The app calls its data APIs
    # directly from the browser, so there is no proxy here.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}

# Production server config for the built Angular bundle.
# Paired with the multi-stage `dockerfile`; replaces the previous `ng serve`
# entrypoint, which was a development server and not safe to expose.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version on responses and error pages.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Upstream market-data proxy --------------------------------------
    # Mirrors proxy.conf.json (dev server) so the same /api/* paths work in
    # the container. Scoped to two fixed upstream paths — not an open proxy.
    # These locations declare no add_header of their own, so they inherit the
    # security headers included above.
    location /api/yf-chart/ {
        proxy_pass https://query1.finance.yahoo.com/v8/finance/chart/;
        proxy_set_header Host       query1.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Stockwatch/1.0)";
        proxy_ssl_server_name on;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    location /api/yf-search {
        proxy_pass https://query2.finance.yahoo.com/v1/finance/search;
        proxy_set_header Host       query2.finance.yahoo.com;
        proxy_set_header User-Agent "Mozilla/5.0 (Stockwatch/1.0)";
        proxy_ssl_server_name on;
        proxy_ssl_verify      on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }

    # --- Static assets ----------------------------------------------------
    # Build output is content-hashed, so it can be cached immutably.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # Set Cache-Control directly rather than via `expires`, which would
        # emit a second, conflicting Cache-Control header alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — client-side routes (/trading, /trading-mobile) resolve
    # to index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}

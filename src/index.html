<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Haze Watch · Southeast Asia air quality</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Track haze across Southeast Asia: modelled US AQI and PM2.5 for 39 cities, a 4-day outlook and health advice.">
  <!--
    Baseline CSP for deployments that don't set response headers (and for the
    Capacitor WebView). security-headers.conf sends the same policy plus
    frame-ancestors, which a meta tag cannot carry — keep the two in sync.
    The only third parties are the Open-Meteo APIs and OpenStreetMap tiles;
    fonts are self-hosted.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://air-quality-api.open-meteo.com https://api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- Light only: ACME v5 has no dark theme. Matches --acme-color-canvas. -->
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <!--
    Start DNS and TLS for the data APIs and map tiles while the JS downloads;
    the first fetch otherwise waits for the app to boot. The APIs are CORS
    fetches (crossorigin); tiles are plain image loads (no crossorigin).
  -->
  <link rel="preconnect" href="https://air-quality-api.open-meteo.com" crossorigin>
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <app-root></app-root>
</body>
</html>

<figure class="chart">
  <figcaption class="chart__caption">
    <span class="chart__title">{{ t().chartTitle }}</span>
    <span class="chart__summary">{{ t().chartRange }} {{ summary() }}</span>
  </figcaption>

  @if (model(); as m) {
    <div class="chart__frame" #frame>
      <svg
        class="chart__svg"
        [attr.viewBox]="'0 0 ' + m.width + ' ' + m.height"
        [attr.width]="m.width"
        [attr.height]="m.height"
        role="img"
        [attr.aria-labelledby]="titleId"
        (pointermove)="onPointerMove($event)"
        (pointerdown)="onPointerMove($event)"
        (pointerleave)="hoverIndex.set(null)"
      >
        <title [attr.id]="titleId">{{ t().chartAriaTitle }} {{ summary() }}</title>

        <g class="bands">
          @for (b of m.bands; track b.id) {
            <svg:rect class="band" [attr.data-cat]="b.id" [attr.x]="m.left" [attr.y]="b.y" [attr.width]="m.right - m.left" [attr.height]="b.height" />
          }
        </g>

        <g class="grid">
          @for (tick of m.yTicks; track tick.label) {
            <svg:line class="grid__y" [attr.x1]="m.left" [attr.x2]="m.right" [attr.y1]="tick.pos" [attr.y2]="tick.pos" />
            <svg:text class="tick tick--y" [attr.x]="m.left - 6" [attr.y]="tick.pos">{{ tick.label }}</svg:text>
          }
          @for (tick of m.xTicks; track tick.pos) {
            <svg:line class="grid__x" [attr.x1]="tick.pos" [attr.x2]="tick.pos" [attr.y1]="m.top" [attr.y2]="m.bottom" />
            <svg:text class="tick tick--x" [attr.x]="tick.pos + 4" [attr.y]="m.height - 6">{{ tick.label }}</svg:text>
          }
        </g>

        <path class="line line--past" [attr.d]="m.pastPath" />
        <path class="line line--forecast" [attr.d]="m.forecastPath" />

        @if (m.nowX !== null) {
          <svg:line class="now" [attr.x1]="m.nowX" [attr.x2]="m.nowX" [attr.y1]="m.top" [attr.y2]="m.bottom" />
          <svg:text class="now__label" [attr.x]="m.nowX + 4" [attr.y]="m.top + 12">{{ t().chartNowLabel }}</svg:text>
        }

        <!-- The one takeaway, labelled directly on the line. -->
        @if (peakMark(); as pk) {
          <svg:circle class="peak" [attr.cx]="pk.x" [attr.cy]="pk.y" r="5" />
          <svg:text class="peak__label" [attr.x]="pk.x" [attr.y]="pk.labelY" [attr.text-anchor]="pk.anchor">{{ pk.label }}</svg:text>
        }

        @if (hovered(); as h) {
          <svg:line class="cursor" [attr.x1]="h.x" [attr.x2]="h.x" [attr.y1]="m.top" [attr.y2]="m.bottom" />
          <svg:circle class="cursor__dot" [attr.cx]="h.x" [attr.cy]="h.y" r="4" />
        }
      </svg>
    </div>

    <!-- Pointer-only extra; the daily outlook table below carries the same data for everyone. -->
    <p class="chart__readout" aria-hidden="true">{{ readout() || t().chartHint }}</p>
    <p class="chart__key">
      <span class="key key--past" aria-hidden="true"></span> {{ t().chartKeyHistory }}
      <span class="key key--forecast" aria-hidden="true"></span> {{ t().chartKeyForecast }}
      <span class="key key--peak" aria-hidden="true"></span> {{ t().chartKeyPeak }}
    </p>
  } @else {
    <p class="chart__empty">{{ t().chartEmpty }}</p>
  }
</figure>

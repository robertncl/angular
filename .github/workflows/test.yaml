name: Unit tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vitest runs the specs in a real Chromium (the map and chart specs
      # measure layout, which jsdom can't). Playwright's Chromium has to match
      # the playwright version in the lockfile, so install that one.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npx ng test --no-watch --no-progress

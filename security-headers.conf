# Security response headers.
#
# Kept in a separate file and re-included in every location block that defines
# its own add_header: nginx only inherits add_header directives from an outer
# level when the inner level declares none of its own, so a single server-level
# copy would be silently dropped by any location that sets Cache-Control.
#
# The page loads no inline scripts, so script-src is plain 'self'. style-src
# does need 'unsafe-inline': Angular injects component styles as inline <style>
# elements. The browser talks to two third parties directly: the Open-Meteo
# APIs (connect-src) and OpenStreetMap tiles (img-src). Keep this policy in sync
# with the <meta> CSP in src/index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://air-quality-api.open-meteo.com https://api.open-meteo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

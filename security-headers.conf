# Security response headers.
#
# Kept in a separate file and re-included in every location block that defines
# its own add_header: nginx only inherits add_header directives from an outer
# level when the inner level declares none of its own, so a single server-level
# copy would be silently dropped by any location that sets Cache-Control.
#
# script-src pins the one inline script in index.html (the theme bootstrap) by
# hash, so scripts need no 'unsafe-inline'. style-src does need it: Angular
# injects component styles as inline <style> elements and templates use
# style="" attributes. If that inline script is edited, recompute the hash here
# and in src/index.html or the theme bootstrap will stop running.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2yirsBSX3viP57TyxK5Vwds+ovtfiwh5352ybizU3J0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
